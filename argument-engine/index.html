<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Argument Engine - a debugger for human arguments</title>
    <meta
      name="description"
      content="Compile an argument into a reasoning graph, inspect its weaknesses, destroy it or steelman it."
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="topbar">
      <h1>ARGUMENT ENGINE</h1>
      <p class="status" id="status-text">
        <span class="dot" id="status-dot"></span>Idle - paste an argument and compile
      </p>
    </header>

    <main id="main" class="panels">
      <section class="pane" aria-labelledby="source-heading">
        <h2 id="source-heading">SOURCE</h2>
        <label for="source-input">Argument</label>
        <textarea
          id="source-input"
          placeholder="Studies show that teenagers who use more social media report more depression. Teenagers need real-world interaction to develop social skills. Social media should be banned for teenagers."
        ></textarea>

        <label for="engine-select">Compiler backend</label>
        <select id="engine-select">
          <option value="heuristic">Heuristic (offline)</option>
          <option value="llm">Local LLM (LM Studio / Ollama)</option>
        </select>

        <div id="llm-config" class="llm-config" hidden>
          <label for="llm-base">Base URL</label>
          <input id="llm-base" value="http://localhost:1234/v1" />
          <label for="llm-model">Model</label>
          <input id="llm-model" placeholder="loaded model id (optional)" />
        </div>

        <div class="actions">
          <button type="button" id="btn-compile" class="primary">COMPILE</button>
          <button type="button" id="btn-destroy">DESTROY MY ARGUMENT</button>
          <button type="button" id="btn-steelman">STEELMAN</button>
        </div>
      </section>

      <section class="pane" aria-labelledby="graph-heading">
        <h2 id="graph-heading">REASONING GRAPH</h2>
        <div id="graph-pane" class="graph">
          <p class="placeholder">Nothing compiled yet.</p>
        </div>
      </section>

      <section class="pane" aria-labelledby="inspector-heading">
        <h2 id="inspector-heading">INSPECTOR</h2>
        <div id="inspector-pane">
          <p class="placeholder">Select a node to inspect it.</p>
        </div>
      </section>

      <section class="console" aria-labelledby="console-heading">
        <h2 id="console-heading">DIAGNOSTICS</h2>
        <p id="console-summary">No compile yet.</p>
        <ol id="console-list"></ol>
      </section>
    </main>

    <footer class="site-footer">
      <p>Everything runs in this browser. Arguments never leave the device.</p>
    </footer>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
