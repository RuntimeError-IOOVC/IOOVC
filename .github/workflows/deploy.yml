name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext bundle
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        env:
          # 已先 build 好 .open-next/worker.js，關閉 wrangler 自動再 build 一次
          OPEN_NEXT_DEPLOY: "true"

      - name: Upload OPENROUTER_API_KEY as a runtime secret
        if: ${{ secrets.OPENROUTER_API_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY" > .secret.env
          npx wrangler secret bulk .secret.env
          rm -f .secret.env

      - name: Warn if the OpenRouter key is missing
        if: ${{ secrets.OPENROUTER_API_KEY == '' }}
        run: |
          echo "::warning::OPENROUTER_API_KEY secret is not set in this repository."
          echo "Add it under Settings -> Secrets and variables -> Actions, or set it"
          echo "in the Cloudflare dashboard under Settings -> Variables and Secrets."
